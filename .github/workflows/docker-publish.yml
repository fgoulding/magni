# Verify the exact checkout before publishing its image to GHCR.
#
#   push to main  -> publishes :latest  (Watchtower on the server auto-redeploys)
#   push a v* tag -> publishes :vX.Y.Z   (a pinned, rollback-able release)
#
# The deploy stack runs `image: ghcr.io/OWNER/REPO:latest`; Watchtower pulls new
# :latest images automatically. See deploy/README.md.
name: Publish image

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Verify application and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run core release checks and discover the complete browser suite
        run: node scripts/release-check.core.mjs

      - name: Upload compact core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-core-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .playwright/release-core/result.json
            .playwright/release-core/browser-manifest.json
            coverage/coverage-summary.json

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-core-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          path: .playwright/release-core/*.log

  browser:
    name: Browser ${{ matrix.project }} (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Keep browser binaries and OS dependencies aligned with package-lock.json.
    # The immutable image avoids repeated apt downloads on every shard.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    # Each job owns an app, disposable SQLite DB and one worker. Parallelism is
    # between runners, preserving file order and avoiding shared-server races.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, engine: chromium, shard: 1 }
          - { project: chromium, engine: chromium, shard: 2 }
          - { project: mobile-safari, engine: webkit, shard: 1 }
          - { project: mobile-safari, engine: webkit, shard: 2 }
    env:
      CI: "true"
      E2E_NAV_DIAGNOSTICS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify preinstalled browser runtime
        env:
          PLAYWRIGHT_ENGINE: ${{ matrix.engine }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { accessSync, constants } = require('node:fs');
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(require('@playwright/test/package.json').version, '1.60.0');
          const browser = require('playwright')[process.env.PLAYWRIGHT_ENGINE];
          accessSync(browser.executablePath(), constants.X_OK);
          const database = new (require('better-sqlite3'))(':memory:');
          assert.deepEqual(database.prepare('SELECT 1 AS ready').get(), { ready: 1 });
          database.close();
          NODE

      - name: Run the assigned browser shard
        run: node scripts/release-check.browser.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - name: Upload compact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: .playwright/release-browser/result.json

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-browser-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 30
          path: |
            .playwright/release-browser/*.log
            .playwright/e2e-results.json
            .playwright/e2e-results.xml
            .playwright/e2e-report/
            .playwright/test-results/

  verify:
    name: Verify release candidate
    needs: [core, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_CORE_RESULT: ${{ needs.core.result }}
      RELEASE_BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download compact core evidence
        uses: actions/download-artifact@v4
        with:
          name: release-core-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - name: Download all compact browser receipts
        uses: actions/download-artifact@v4
        with:
          pattern: release-browser-${{ github.sha }}-${{ github.run_attempt }}-*
          path: .playwright/release-input/browser

      - name: Require every gate and every discovered browser case
        run: node scripts/release-check.aggregate.mjs

      - name: Upload small release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .playwright/release-checks/*.json
            coverage/coverage-summary.json

  build-and-push:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A v* tag must not implicitly overwrite the auto-deployed latest tag.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}},priority=50
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          # Cache every layer (incl. the apt + `npm ci` deps stage) in the GitHub
          # Actions cache. Subsequent builds reuse them, so a transient apt/npm
          # network hiccup no longer fails the build once a good cache exists.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          const result = {
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            version: process.env.IMAGE_VERSION,
            tags: process.env.IMAGE_TAGS.split('\n').filter(Boolean),
            digest: process.env.IMAGE_DIGEST,
            verifiedRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          };
          if (!/^sha256:[a-f0-9]{64}$/.test(result.digest)) throw new Error('Missing immutable image digest');
          const pinnedImage = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}@${result.digest}`;
          writeFileSync('published-image.json', JSON.stringify({ ...result, pinnedImage }, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Verified commit: ${result.commit}\n\nPinned image: \`${pinnedImage}\`\n`);
          NODE

      - name: Upload immutable image identity
        uses: actions/upload-artifact@v4
        with:
          name: published-image-${{ github.sha }}-${{ github.run_attempt }}
          path: published-image.json
          if-no-files-found: error
          retention-days: 90
